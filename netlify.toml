[build]
  publish = "."

# Johnstown's own location page was a near-verbatim duplicate of Newcastle's
# (same rural southwest-Dublin cluster, template not differentiated) —
# consolidated into Newcastle rather than risk duplicate-content penalties
# on both. Exact literal path, no placeholder, so no redirect-loop risk.
[[redirects]]
  from = "/locations/johnstown/"
  to = "/locations/newcastle/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Versioned via ?v= query strings (see css/js <link>/<script> tags) — safe to cache
# aggressively since a content change always ships with a new version number.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# NOTE: a previous trailing-slash canonicalization redirect here
# (/locations/:slug -> /locations/:slug/, and the same for
# carpet-cleaning-kildare/wicklow, blog, and guides) caused an infinite
# redirect loop in production: Netlify's :slug placeholder also matched the
# already-slashed URL, so the rule redirected /locations/ballsbridge/ to
# itself forever (ERR_TOO_MANY_REDIRECTS). Removed. Netlify's default
# pretty-URL serving already returns both slash forms as 200 with identical
# content, and every page's rel=canonical (trailing-slash form) already
# handles the duplicate-URL SEO concern without the loop risk.
